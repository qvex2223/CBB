# GitHub Pages config for the bughunter docs site.
# Built from the /docs folder. Uses just-the-docs for built-in search.
title: bughunter
description: >-
  An agent skill bundle plus a deterministic runner that turns an agent CLI into a
  bug-hunting operator: gated requests, per-class proof rules, 68 skills and 155
  disclosed-report patterns.
remote_theme: just-the-docs/just-the-docs

url: "https://qvex2223.github.io"
baseurl: "/CBB"

# Search (just-the-docs built-in)
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Repo links in the nav footer
aux_links:
  "GitHub":
    - "https://github.com/elementalsouls/Claude-BugHunter"
  "Sponsor — Atlas Cloud":
    - "https://www.atlascloud.ai/console/coding-plan"
aux_links_new_tab: true

color_scheme: dark
heading_anchors: true

# Don't try to render engineering/meta files as site pages.
exclude:
  - disclosed-reports/
  - verification/
  - automation/
  - "*.py"
  - ".DS_Store"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
